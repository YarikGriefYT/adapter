<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Безликий | Био-ссылки</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070708;
      --primary: #8B5CF6;
      --secondary: #D946EF;
      --accent: #FFD700;
      --card-bg: rgba(13, 13, 18, 0.55);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent; /* Убирает стандартный синий квадрат при тапе на мобилках */
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('IMG_20260516_221634_820.jpg') no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
      overflow-x: hidden;
      background-color: var(--bg-dark);
    }

    /* Холст для эффектов погоды */
    #weather-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Улучшенный кастомный курсор (только для десктопов) */
    @media (pointer: fine) {
      body { cursor: none; }
      a, button, .link-item, .projects-card, .server-card, .profile-link, .ip-badge { cursor: none !important; }
      
      .custom-cursor-dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        position: fixed;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 10000;
        transition: transform 0.1s ease;
      }
      .custom-cursor-circle {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(255, 215, 0, 0.3);
        position: fixed;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease, border-color 0.3s ease;
        transform: translate(-50%, -50%);
      }
      .custom-cursor-circle.hovered {
        transform: scale(1.5);
        background: rgba(255, 215, 0, 0.08);
        border-color: var(--accent);
      }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
      animation: pulseGlow 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.15); }
    }

    .container {
      width: 100%;
      max-width: 410px;
      position: relative;
      z-index: 2;
    }

    .animate-item {
      opacity: 0;
      transform: translateY(30px) scale(0.97);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .animate-item.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .delay-1 { transition-delay: 0.04s; }
    .delay-2 { transition-delay: 0.10s; }
    .delay-3 { transition-delay: 0.16s; }
    .delay-4 { transition-delay: 0.22s; }
    .delay-5 { transition-delay: 0.28s; }
    .delay-6 { transition-delay: 0.34s; }
    .delay-7 { transition-delay: 0.40s; }
    .delay-8 { transition-delay: 0.46s; }
    .delay-9 { transition-delay: 0.52s; }

    /* Общий стиль стеклянных премиум-панелей */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* Эффект нажатия для всех интерактивных элементов */
    .glass-panel:active, .ip-badge:active {
      transform: scale(0.97) translateY(0) !important;
      opacity: 0.95;
    }

    /* Карточка профиля */
    .profile-link {
      display: flex;
      text-decoration: none;
      color: inherit;
      padding: 22px;
      margin-bottom: 14px;
      align-items: center;
      gap: 18px;
    }

    .profile-link:hover {
      background: rgba(20, 20, 28, 0.65);
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 16px 35px rgba(139, 92, 246, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .profile-link:hover .avatar {
      transform: scale(1.05) rotate(3deg);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info h1 {
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(135deg, #b49bff 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-info .username {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 3px;
    }

    /* Сетка кнопок */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    /* Кайфовые кнопки соцсетей */
    .link-item {
      border-radius: 22px;
      padding: 22px 0;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .link-item:hover {
      transform: translateY(-4px);
      background: rgba(25, 25, 35, 0.7);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .link-item i {
      font-size: 2rem;
      margin-bottom: 10px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
    }

    .link-item:hover i {
      transform: scale(1.2) translateY(-2px);
    }

    .link-item span {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.85);
      transition: color 0.3s ease;
    }
    
    .link-item:hover span {
      color: #ffffff;
    }

    /* Цветовые стили кнопок, неоновые тени и мягкий внутренний свет */
    .link-item.telegram i { color: #2AABEE; }
    .link-item.telegram:hover { 
      border-color: rgba(42, 171, 238, 0.4); 
      box-shadow: 0 12px 25px rgba(42, 171, 238, 0.15), inset 0 1px 10px rgba(42, 171, 238, 0.1);
    }

    .link-item.github i { color: #ffffff; }
    .link-item.github:hover { 
      border-color: rgba(255, 255, 255, 0.3); 
      box-shadow: 0 12px 25px rgba(255, 255, 255, 0.1);
    }

    .link-item.tiktok i { color: #ff0050; }
    .link-item.tiktok:hover { 
      border-color: rgba(255, 0, 80, 0.4); 
      box-shadow: 0 12px 25px rgba(255, 0, 80, 0.15), inset 0 1px 10px rgba(255, 0, 80, 0.1);
    }

    .link-item.vk i { color: #4A76A8; }
    .link-item.vk:hover { 
      border-color: rgba(74, 118, 168, 0.4); 
      box-shadow: 0 12px 25px rgba(74, 118, 168, 0.15), inset 0 1px 10px rgba(74, 118, 168, 0.1);
    }

    .link-item.instagram i { color: #E1306C; }
    .link-item.instagram:hover { 
      border-color: rgba(225, 48, 108, 0.4); 
      box-shadow: 0 12px 25px rgba(225, 48, 108, 0.2), inset 0 1px 10px rgba(225, 48, 108, 0.1);
    }

    .link-item.instagram { grid-column: span 2; padding: 20px 0; }

    /* Кнопка Проекты */
    .projects-card {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      color: white;
      margin-bottom: 14px;
    }

    .projects-card:hover {
      background: rgba(25, 25, 35, 0.7);
      transform: translateY(-3px);
      border-color: rgba(139, 92, 246, 0.4);
      box-shadow: 0 14px 30px rgba(139, 92, 246, 0.15), inset 0 1px 10px rgba(139, 92, 246, 0.05);
    }

    .projects-card i { font-size: 1.9rem; color: #a78bfa; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .projects-card:hover i { transform: rotate(12deg) scale(1.15); color: #c0a8ff; }
    .projects-card .info h3 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.3px; }
    .projects-card .info p { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

    /* Мониторинг Сервера */
    .server-card {
      border: 1px solid rgba(255, 215, 0, 0.12);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: white;
      margin-bottom: 14px;
    }

    .server-card:hover {
      background: rgba(25, 25, 35, 0.65);
      transform: translateY(-3px);
      border-color: rgba(255, 215, 0, 0.4);
      box-shadow: 0 14px 30px rgba(255, 215, 0, 0.12);
    }

    .server-card i { font-size: 1.9rem; color: var(--accent); transition: transform 0.4s ease; }
    .server-card:hover i { transform: scale(1.1) rotate(-8deg); }
    .server-card .info h3 { font-size: 1.1rem; font-weight: 600; color: var(--accent); letter-spacing: 0.3px; }
    .server-card .info p { font-size: 0.82rem; color: var(--text-muted); margin-top: 1px; }

    /* Копирование IP кликабельный бейдж */
    .ip-badge {
      background: rgba(255, 215, 0, 0.07);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 14px;
      padding: 6px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .ip-badge:hover { background: rgba(255, 215, 0, 0.18); border-color: var(--accent); transform: translateY(-1px); }
    .ip-badge.copied { background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #10b981; }

    /* YouTube кнопка на всю ширину */
    .youtube-full {
      border-radius: 24px;
      padding: 16px 20px;
      width: 100%;
      border: 1px solid rgba(239, 68, 68, 0.15);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: white;
    }

    .youtube-full:hover {
      background: rgba(25, 25, 35, 0.7);
      transform: translateY(-3px);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 14px 30px rgba(239, 68, 68, 0.15), inset 0 1px 10px rgba(239, 68, 68, 0.05);
    }

    .youtube-full i { color: #ef4444; font-size: 1.6rem; animation: pulse 2.5s ease-in-out infinite; }
    .youtube-full span { font-size: 0.9rem; font-weight: 600; letter-spacing: 0.5px; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; text-shadow: 0 0 15px rgba(239,68,68,0.5); }
    }

    /* Плеер аудио */
    .audio-menu {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .audio-menu.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .visualizer-canvas { width: 100%; height: 40px; display: block; border-radius: 10px; }
    .audio-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .audio-status { color: var(--text-muted); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
    .audio-status .status-on { color: var(--primary); font-weight: 700; }
    .audio-status .status-off { color: #ef4444; font-weight: 700; }
    
    .mute-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 6px 16px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    .mute-btn:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.25); }
    .mute-btn:active { transform: scale(0.95); }
    .mute-btn.muted { border-color: rgba(239, 68, 68, 0.25); color: #ef4444; }
    .mute-btn.muted:hover { background: rgba(239, 68, 68, 0.1); }

    @media (max-width: 480px) {
      .visualizer-canvas { height: 32px; }
      .profile-info h1 { font-size: 1.45rem; }
      .avatar { width: 68px; height: 68px; }
      .link-item { padding: 18px 0; border-radius: 20px; }
      .link-item i { font-size: 1.8rem; margin-bottom: 6px; }
    }

    /* Лоадер */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-content { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 24px; }
    
    .loader-ring { width: 50px; height: 50px; position: relative; }
    .loader-ring::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid transparent; border-top-color: var(--primary);
      border-right-color: var(--secondary); animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loading-text { color: rgba(255,255,255,0.4); font-size: 0.7rem; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; }

    /* Экран входа */
    #enter-screen {
      position: fixed;
      inset: 0;
      background: rgba(7, 7, 8, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      transition: opacity 0.5s ease;
    }

    #enter-screen.visible { display: flex; }
    #enter-screen.hidden { opacity: 0; pointer-events: none; }
    .enter-content { text-align: center; display: flex; align-items: center; gap: 10px; }
    .enter-content .cursor { display: inline-block; width: 2px; height: 18px; background: var(--primary); animation: blink 1.1s step-end infinite; }
    .enter-content .text { color: var(--primary); font-size: 0.85rem; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>

    <a href="https://tiktok.com/@ltz_yarik" target="_blank" class="glass-panel link-item tiktok animate-item delay-4">

<script>
  const loadingScreen = document.getElementById('loading-screen');
  const enterScreen = document.getElementById('enter-screen');
  const audio = document.getElementById('bg-music');
  const clickSound = document.getElementById('click-sound');
  const animatedItems = document.querySelectorAll('.animate-item');
  const audioMenu = document.getElementById('audio-menu');

  if (clickSound) clickSound.volume = 0.25;

  // ================================
  // СИСТЕМА ЭФФЕКТОВ ПОГОДЫ (Canvas)
  // ================================
  const weatherCanvas = document.getElementById('weather-canvas');
  const wCtx = weatherCanvas.getContext('2d');
  let wWidth, wHeight;
  let weatherParticles = [];
  let isRainingRealtime = false;
  let lastSparkTime = 0;

  function resizeWeatherCanvas() {
    wWidth = weatherCanvas.width = window.innerWidth;
    wHeight = weatherCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeWeatherCanvas);
  resizeWeatherCanvas();

  function spawnSparkBurst() {
    const sparkCount = 65;
    for (let i = 0; i < sparkCount; i++) {
      weatherParticles.push({
        x: Math.random() * wWidth,
        y: wHeight + 15,
        vx: (Math.random() - 0.5) * 2.5,
        vy: -Math.random() * 3.5 - 1.5,
        size: Math.random() * 2.5 + 1,
        color: Math.random() > 0.4 ? '#FFD700' : '#D946EF',
        alpha: 1,
        decay: Math.random() * 0.012 + 0.004,
        type: 'spark'
      });
    }
  }

  function spawnRainDrop() {
    if (weatherParticles.length < 140) {
      weatherParticles.push({
        x: Math.random() * (wWidth + 100),
        y: -30,
        vy: Math.random() * 6 + 11,
        vx: -1.5,
        length: Math.random() * 25 + 15,
        alpha: Math.random() * 0.25 + 0.15,
        type: 'rain'
      });
    }
  }

  function updateWeatherAnimation() {
    wCtx.clearRect(0, 0, wWidth, wHeight);

    if (isRainingRealtime) {
      spawnRainDrop();
    } else {
      const now = Date.now();
      if (now - lastSparkTime > 30000) {
        spawnSparkBurst();
        lastSparkTime = now;
      }
    }

    for (let i = weatherParticles.length - 1; i >= 0; i--) {
      let p = weatherParticles[i];

      if (p.type === 'rain') {
        p.y += p.vy;
        p.x += p.vx;
        wCtx.strokeStyle = `rgba(167, 139, 250, ${p.alpha})`;
        wCtx.lineWidth = 1.2;
        wCtx.beginPath();
        wCtx.moveTo(p.x, p.y);
        wCtx.lineTo(p.x + p.vx, p.y + p.length);
        wCtx.stroke();

        if (p.y > wHeight + 20) weatherParticles.splice(i, 1);
      } 
      else if (p.type === 'spark') {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        wCtx.fillStyle = p.color;
        wCtx.shadowBlur = 8;
        wCtx.shadowColor = p.color;
        wCtx.globalAlpha = p.alpha;
        wCtx.beginPath();
        wCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        wCtx.fill();
        
        wCtx.globalAlpha = 1;
        wCtx.shadowBlur = 0;

        if (p.alpha <= 0) weatherParticles.splice(i, 1);
      }
    }
    requestAnimationFrame(updateWeatherAnimation);
  }

  function detectRealWeather() {
    fetch('https://freeipapi.com/api/json')
      .then(res => res.json())
      .then(geo => {
        const lat = geo.latitude;
        const lon = geo.longitude;
        return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      })
      .then(res => res.json())
      .then(weather => {
        const code = weather.current_weather.weathercode;
        const rainCodes = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
        isRainingRealtime = rainCodes.includes(code);
      })
      .catch(() => {
        isRainingRealtime = Math.random() < 0.3;
      });
  }
  detectRealWeather();

  // ================================
  // СМУТ-КУРСОР
  // ================================
  const dot = document.getElementById('cursor-dot');
  const circle = document.getElementById('cursor-circle');
  
  if (dot && circle) {
    let mouseX = 0, mouseY = 0;
    let circleX = 0, circleY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      dot.style.transform = `translate(${mouseX - 3}px, ${mouseY - 3}px)`;
    });

    function delayLoop() {
      circleX += (mouseX - circleX) * 0.15;
      circleY += (mouseY - circleY) * 0.15;
      circle.style.left = `${circleX}px`;
      circle.style.top = `${circleY}px`;
      requestAnimationFrame(delayLoop);
    }
    delayLoop();

    document.querySelectorAll('a, button, .ip-badge').forEach(el => {
      el.addEventListener('mouseenter', () => circle.classList.add('hovered'));
      el.addEventListener('mouseleave', () => circle.classList.remove('hovered'));
    });
  }

  // ================================
  // ЛОАДЕР И ВХОД
  // ================================
  window.addEventListener('load', () => {
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
      enterScreen.classList.add('visible');
    }, 600);
  });

  enterScreen.addEventListener('click', () => {
    if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(() => {}); }
    enterScreen.classList.add('hidden');

    if (audio) {
      audio.play().then(() => { updateAudioUI(true); }).catch(() => {});
    }

    lastSparkTime = Date.now() - 28000;
    updateWeatherAnimation();

    animatedItems.forEach((item, index) => {
      setTimeout(() => { item.classList.add('visible'); }, 50 + (index * 70));
    });

    setTimeout(() => { audioMenu.classList.add('visible'); }, 600);
  });

  document.querySelectorAll('a, button, .ip-badge').forEach(el => {
    el.addEventListener('click', () => {
      if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(() => {}); }
    });
  });

  // ================================
  // ВИЗУАЛИЗАТОР
  // ================================
  const canvas = document.getElementById('visualizer-canvas');
  const ctx = canvas.getContext('2d');
  const statusText = document.getElementById('status-text');
  const muteBtn = document.getElementById('mute-btn');

  let audioContext, analyser, dataArray, source;
  let animationId = null;
  let isVisualizerActive = false;

  function resizeCanvas() {
    canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
    canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
    ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  }

  function initVisualizer() {
    if (!audio) return;
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.82;
      
      source = audioContext.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      isVisualizerActive = true;
      drawVisualizer();
    } catch (e) {
      console.log('Аудиоконтекст заблокирован');
    }
  }

  function drawVisualizer() {
    if (!isVisualizerActive) return;
    animationId = requestAnimationFrame(drawVisualizer);
    analyser.getByteFrequencyData(dataArray);
    
    const width = canvas.width / (window.devicePixelRatio || 1);
    const height = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, width, height);
    
    const barWidth = (width / dataArray.length) * 1.4;
    let x = 0;
    
    for (let i = 0; i < dataArray.length; i++) {
      const value = dataArray[i];
      const barHeight = (value / 255) * height * 0.9;
      
      const gradient = ctx.createLinearGradient(0, height, 0, 0);
      gradient.addColorStop(0, 'rgba(139, 92, 246, 0.2)');
      gradient.addColorStop(1, '#8B5CF6');
      
      ctx.fillStyle = gradient;
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(139, 92, 246, 0.6)';
      
      ctx.beginPath();
      ctx.roundRect(x, height - barHeight, barWidth - 2, barHeight, [4, 4, 0, 0]);
      ctx.fill();
      
      x += barWidth;
    }
  }

  function updateAudioUI(isPlaying) {
    if (isPlaying) {
      statusText.textContent = 'ON'; statusText.className = 'status-on';
      muteBtn.textContent = '[ mute ]'; muteBtn.classList.remove('muted');
    } else {
      statusText.textContent = 'OFF'; statusText.className = 'status-off';
      muteBtn.textContent = '[ unmute ]'; muteBtn.classList.add('muted');
    }
  }

  audio.addEventListener('play', () => {
    updateAudioUI(true);
    if (!audioContext) initVisualizer();
    else if (audioContext.state === 'suspended') audioContext.resume();
    isVisualizerActive = true;
    drawVisualizer();
  });

  audio.addEventListener('pause', () => {
    updateAudioUI(false);
    isVisualizerActive = false;
    if (animationId) cancelAnimationFrame(animationId);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audio.paused) audio.play(); else audio.pause();
  });

  // ================================
  // КОПИРОВАНИЕ IP
  // ================================
  function copyIP(event) {
    event.stopPropagation();
    const ip = 'yarik.ezhikmine.ru';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ip).then(showCopiedFeedback).catch(() => fallbackCopy(ip));
    } else {
      fallbackCopy(ip);
    }
  }

  function fallbackCopy(text) {
    const textArea = document.createElement('textarea');
    textArea.value = text;
    textArea.style.position = 'fixed'; textArea.style.opacity = '0';
    document.body.appendChild(textArea);
    textArea.select();
    try { document.execCommand('copy'); showCopiedFeedback(); } catch (err) {}
    document.body.removeChild(textArea);
  }

  function showCopiedFeedback() {
    const badge = document.getElementById('ip-copy');
    const originalText = badge.innerHTML;
    badge.innerHTML = '<i class="fas fa-check"></i> скопировано!';
    badge.classList.add('copied');
    setTimeout(() => {
      badge.innerHTML = originalText;
      badge.classList.remove('copied');
    }, 2000);
  }
</script>
