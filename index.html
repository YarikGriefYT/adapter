<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARIK | Portfolio</title>
    <!-- Подключаем иконки FontAwesome и кастомный шрифт Orbitron -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(rgba(10, 5, 18, 0.85), rgba(10, 5, 18, 0.85)), 
                        url('000') no-repeat center center / cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- ЭКРАН ЗАГРУЗКИ И ВХОДА --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0512;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-circle {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #00d2ff;
            border-bottom: 3px solid #9b51e0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-percent {
            font-size: 18px;
            font-weight: 600;
            color: #8a8a93;
            letter-spacing: 1px;
            transition: all 0.5s ease;
        }

        .enter-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            display: none;
            cursor: pointer;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.6; filter: drop-shadow(0 0 0px rgba(0,210,255,0)); }
            100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(155,81,224,0.6)); }
        }

        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --- ОСНОВНОЙ КОНТЕНТ (КАРТОЧКА) --- */
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: translateY(30px);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.1, 1, 0.1, 1), opacity 1s ease;
        }

        body.loaded .container {
            transform: translateY(0);
            opacity: 1;
        }

        /* --- ПЛАВНЫЙ ВЗЛЕТ КНОПОК --- */
        .anim-item {
            opacity: 0;
            transform: translateY(25px);
            transition: opacity 0.8s cubic-bezier(0.1, 1, 0.1, 1), transform 0.8s cubic-bezier(0.1, 1, 0.1, 1);
        }

        body.loaded .anim-item:nth-child(1) { transition-delay: 0.2s; opacity: 1; transform: translateY(0); }
        body.loaded .anim-item:nth-child(2) { transition-delay: 0.35s; opacity: 1; transform: translateY(0); }
        body.loaded .anim-item:nth-child(3) { transition-delay: 0.5s; opacity: 1; transform: translateY(0); }
        body.loaded .anim-item:nth-child(4) { transition-delay: 0.65s; opacity: 1; transform: translateY(0); }
        body.loaded .anim-item:nth-child(5) { transition-delay: 0.8s; opacity: 1; transform: translateY(0); }

        /* Профиль */
        .profile-section { margin-bottom: 25px; }
        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d2ff, #9b51e0);
            z-index: -1;
            opacity: 0.7;
            filter: blur(6px);
        }

        .name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #00d2ff, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tag { font-size: 14px; color: #8a8a93; margin-top: 4px; }

        /* Сетка кнопок */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            padding: 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 15px;
            font-weight: 500;
            transition: background 0.3s, border-color 0.3s, transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .btn:active, .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.4);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 210, 255, 0.15);
        }
        .btn-full {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            padding: 16px;
            text-decoration: none;
            color: #fff;
        }
        .btn-full .left-side {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .btn-full .desc { font-size: 12px; color: #8a8a93; display: block; margin-top: 2px; }

        .btn-server {
            background: linear-gradient(135deg, rgba(241, 196, 15, 0.1), rgba(230, 126, 34, 0.1));
            border: 1px solid rgba(241, 196, 15, 0.2);
        }
        .btn-server:active, .btn-server:hover {
            border-color: #f1c40f;
            box-shadow: 0 8px 20px rgba(241, 196, 15, 0.25);
        }
        .server-icon { color: #f1c40f; }

        /* Плеер */
        .player-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8a8a93;
            margin-bottom: 10px;
        }
        .bars-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 3px;
            height: 30px;
        }
        .bar {
            width: 6px;
            background: #9b51e0;
            border-radius: 3px;
            height: 20%;
            transition: height 0.2s ease;
        }
        .playing .bar { animation: bounce 0.8s ease infinite alternate; }
        .playing .bar:nth-child(2n) { animation-duration: 0.4s; background: #00d2ff; }
        .playing .bar:nth-child(3n) { animation-duration: 0.6s; }
        .playing .bar:nth-child(4n) { animation-duration: 0.7s; background: #9b51e0; }

        @keyframes bounce {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        .mute-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Поп-ап уведомления */
        #toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 10, 25, 0.95);
            border: 1px solid #ff4757;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10000;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.2);
            backdrop-filter: blur(5px);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            opacity: 0;
            pointer-events: none;
        }
        #toast.show { bottom: 30px; opacity: 1; }
        #toast.success { border-color: #2ed573; box-shadow: 0 10px 25px rgba(46, 213, 115, 0.2); }
    </style>
</head>
<body>

    <!-- ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ -->
    <div id="toast">В разработке... </div>

    <!-- ЭКРАН ЗАГРУЗКИ / ВХОДА -->
    <div id="preloader">
        <div class="loader-circle" id="loaderCircle"></div>
        <div class="loader-percent" id="loaderPercent">0%</div>
        <div class="enter-text" id="enterText">CLICK HERE</div>
    </div>

    <!-- ГЛАВНАЯ СТРАНИЦА -->
    <div class="container">
        
        <!-- Блок профиля (Анимация 1) -->
        <div class="profile-section anim-item">
            <div class="avatar-wrapper">
                <img src="pppp.png" alt="Avatar" class="avatar">
            </div>
            <div class="name">YARIK</div>
            <div class="tag">@vkverity</div>
        </div>

        <!-- Сетка кнопок (Анимация 2) -->
        <div class="social-grid anim-item">
            <a href="https://t.me/vkverity" class="btn" target="_blank">
                <i class="fab fa-telegram" style="color: #0088cc;"></i> TG
            </a>
            <a href="https://youtube.com/@ltz_yarik" class="btn" target="_blank">
                <i class="fab fa-youtube" style="color: #ff0000;"></i> YouTube
            </a>
            <a href="https://vk.com/ltz_yarik" class="btn" target="_blank">
                <i class="fab fa-vk" style="color: #0077ff;"></i> VK
            </a>
            <div class="btn" onclick="showDevAlert()">
                <i class="fab fa-tiktok" style="color: #00f2fe;"></i> TikTok
            </div>
            <!-- Первая кнопка GitHub -->
            <a href="https://github.com/YarikGriefYT" class="btn" target="_blank">
                <i class="fab fa-github"></i> GitHub 1
            </a>
            <!-- Вторая кнопка GitHub -->
            <a href="https://github.com/YarikGriefYT" class="btn" target="_blank">
                <i class="fab fa-github" style="color: #9b51e0;"></i> GitHub 2
            </a>
        </div>

        <!-- Кнопка Проекты (Анимация 3) -->
        <a href="https://t.me/adapter_yarik" class="btn btn-full anim-item" target="_blank">
            <div class="left-side">
                <i class="fa-solid fa-code-branch" style="color: #a55eea;"></i>
                <div>
                    <span>Мои проекты</span>
                    <span class="desc">Скрипты, плагины и исходники</span>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size: 12px; opacity: 0.5;"></i>
        </a>

        <!-- Кнопка Копирования IP Сервера (Анимация 4) -->
        <div class="btn btn-full btn-server anim-item" onclick="copyServerIP()">
            <div class="left-side">
                <i class="fa-solid fa-cube server-icon"></i>
                <div>
                    <span>FixCube</span>
                    <span class="desc" style="color: #f1c40f;">Нажми, чтобы скопировать IP сервера</span>
                </div>
            </div>
            <i class="fa-regular fa-copy server-icon" style="font-size: 14px;"></i>
        </div>

        <!-- Музыкальный плеер (Анимация 5) -->
        <div class="player-card anim-item" id="playerCard">
            <div class="player-info">
                <span>МУЗЫКА: <b id="statusText" style="color:#ff4757;">OFF</b></span>
                <button class="mute-btn" id="playBtn">PLAY</button>
            </div>
            <div class="bars-container">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>
    </div>

    <!-- Музыка -->
    <audio id="bgMusic" src="fffff.mp3" loop></audio>

    <script>
        const preloader = document.getElementById('preloader');
        const loaderCircle = document.getElementById('loaderCircle');
        const loaderPercent = document.getElementById('loaderPercent');
        const enterText = document.getElementById('enterText');
        
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playerCard = document.getElementById('playerCard');
        const statusText = document.getElementById('statusText');
        const toast = document.getElementById('toast');

        // Логика загрузки
        let percent = 0;
        const interval = setInterval(() => {
            percent += Math.floor(Math.random() * 4) + 1;
            if (percent >= 100) {
                percent = 100;
                clearInterval(interval);
                showClickButton();
            }
            loaderPercent.innerText = percent + '%';
        }, 40);

        function showClickButton() {
            loaderCircle.style.opacity = '0';
            loaderPercent.style.opacity = '0';
            
            setTimeout(() => {
                loaderCircle.style.display = 'none';
                loaderPercent.style.display = 'none';
                enterText.style.display = 'block';
                setTimeout(() => { enterText.style.opacity = '1'; }, 50);
            }, 500);
        }

        preloader.addEventListener('click', () => {
            if (percent === 100) {
                preloader.classList.add('hidden');
                document.body.classList.add('loaded');
                setTimeout(turnMusicOn, 400);
            }
        });

        function turnMusicOn() {
            audio.play().catch(e => console.log("Музыка ждет ручного клика"));
            playerCard.classList.add('playing');
            statusText.innerText = 'ON';
            statusText.style.color = '#2ed573';
            playBtn.innerText = 'MUTE';
        }

        function turnMusicOff() {
            audio.pause();
            playerCard.classList.remove('playing');
            statusText.innerText = 'OFF';
            statusText.style.color = '#ff4757';
            playBtn.innerText = 'PLAY';
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) { turnMusicOn(); } else { turnMusicOff(); }
        });

        // Уведомление для TikTok
        function showDevAlert() {
            toast.classList.remove('success');
            toast.borderStyle = "1px solid #ff4757";
            toast.innerText = "В разработке... 🛠️";
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // Функция копирования IP сервера
        function copyServerIP() {
            const ip = "fixcube.rustix.su";
            navigator.clipboard.writeText(ip).then(() => {
                toast.classList.add('success');
                toast.innerText = "IP сервера скопирован! 📋";
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        }
    </script>
</body>
</html>
